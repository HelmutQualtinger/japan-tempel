{"imports":{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Szene ----------
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(22, 14, 34);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.minDistance = 5;
controls.maxDistance = 90;
controls.autoRotateSpeed = 0.6;

// ---------- Licht ----------
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x554433, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:120});
scene.add(sun);

// ---------- Materialien ----------
// ---------- Prozedurale Texturen (Canvas, keine externen Dateien) ----------
let tseed=11; const trnd=()=>(tseed=(tseed*16807)%2147483647)/2147483647;
function canvasTex(size, draw, rep=[1,1]){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d'); draw(ctx,size);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}
const speckle=(ctx,s,n,cols,r0,r1,a=1)=>{
  ctx.globalAlpha=a;
  for(let i=0;i<n;i++){
    ctx.fillStyle=cols[(trnd()*cols.length)|0];
    const r=r0+trnd()*(r1-r0);
    ctx.beginPath(); ctx.arc(trnd()*s,trnd()*s,r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
};
// Holzmaserung (senkrecht), nahtlos über x-Wrap
function woodDraw(base,light,dark){
  return (ctx,s)=>{
    ctx.fillStyle=base; ctx.fillRect(0,0,s,s);
    for(let i=0;i<140;i++){
      const x=trnd()*s, w=0.5+trnd()*2.5, wob=trnd()*6, ph=trnd()*6;
      ctx.strokeStyle=trnd()<.5?light:dark; ctx.globalAlpha=0.08+trnd()*0.22; ctx.lineWidth=w;
      ctx.beginPath();
      for(let y=0;y<=s;y+=8){ const xx=x+Math.sin(y/s*6.28+ph)*wob; y?ctx.lineTo(xx,y):ctx.moveTo(xx,y); }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  };
}
const T = {
  wood: canvasTex(256, woodDraw('#8b2e1f','#b04a32','#4a140c')),
  dark: canvasTex(256, woodDraw('#3a281d','#5c4130','#1c110b')),
  stone: canvasTex(512,(ctx,s)=>{
    ctx.fillStyle='#8e8c85'; ctx.fillRect(0,0,s,s);
    const rows=4, bh=s/rows;
    for(let r=0;r<rows;r++){
      const off=(r%2)*s/4;
      for(let c=-1;c<3;c++){
        const x=c*s/2+off, shade=120+trnd()*50;
        ctx.fillStyle=`rgb(${shade},${shade-2},${shade-8})`;
        ctx.fillRect(x+3,r*bh+3,s/2-6,bh-6);
      }
    }
    speckle(ctx,s,2200,['#6d6b66','#b3b0a6','#7c7a73','#a09d92'],0.6,2.4,0.55);
    ctx.strokeStyle='#4f4d49'; ctx.lineWidth=4;
    for(let r=0;r<=rows;r++){ ctx.beginPath(); ctx.moveTo(0,r*bh); ctx.lineTo(s,r*bh); ctx.stroke(); }
    for(let r=0;r<rows;r++){ const off=(r%2)*s/4;
      for(let c=-1;c<3;c++){ const x=c*s/2+off; ctx.beginPath(); ctx.moveTo(x,r*bh); ctx.lineTo(x,(r+1)*bh); ctx.stroke(); } }
  }),
  gravel: canvasTex(256,(ctx,s)=>{
    ctx.fillStyle='#cdc4ae'; ctx.fillRect(0,0,s,s);
    speckle(ctx,s,3500,['#b5ab94','#e6dfcc','#a39a85','#d8d0bb','#8f866f'],0.7,2.2,0.85);
    // Harkenmuster
    ctx.strokeStyle='#9a917b'; ctx.globalAlpha=0.35; ctx.lineWidth=1.5;
    for(let x=6;x<s;x+=12){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,s); ctx.stroke(); }
    ctx.globalAlpha=1;
  }),
  grass: canvasTex(256,(ctx,s)=>{
    ctx.fillStyle='#4b7a35'; ctx.fillRect(0,0,s,s);
    speckle(ctx,s,900,['#3f6b2c','#5d9142','#6aa04b','#386226'],2,6,0.35);
    ctx.lineWidth=1;
    for(let i=0;i<2600;i++){
      const x=trnd()*s,y=trnd()*s,l=4+trnd()*7;
      ctx.strokeStyle=['#2f5a22','#6fa84f','#82b95a','#3f7a2c'][(trnd()*4)|0]; ctx.globalAlpha=0.7;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+(trnd()-.5)*4,y-l); ctx.stroke();
    }
    ctx.globalAlpha=1;
  },[70,70]),
  plaster: canvasTex(256,(ctx,s)=>{
    ctx.fillStyle='#efe6d0'; ctx.fillRect(0,0,s,s);
    speckle(ctx,s,1800,['#d9cfb6','#fbf5e6','#cfc4a8'],0.5,3,0.35);
  }),
  tile: canvasTex(256,(ctx,s)=>{
    ctx.fillStyle='#2c3138'; ctx.fillRect(0,0,s,s);
    const n=8, w=s/n;
    // Ziegelreihen mit halbrunden Kanten
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      const x=c*w, y=r*w, shade=38+trnd()*22;
      ctx.fillStyle=`rgb(${shade},${shade+4},${shade+12})`;
      ctx.fillRect(x+1,y,w-2,w);
      ctx.strokeStyle='#14171b'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x+w/2,y+w*0.15,w*0.5,0,Math.PI); ctx.stroke();
    }
    ctx.strokeStyle='#14171b'; ctx.lineWidth=2;
    for(let c=0;c<=n;c++){ ctx.beginPath(); ctx.moveTo(c*w,0); ctx.lineTo(c*w,s); ctx.stroke(); }
  }),
  bark: canvasTex(256,(ctx,s)=>{
    ctx.fillStyle='#5a4030'; ctx.fillRect(0,0,s,s);
    for(let i=0;i<110;i++){
      const x=trnd()*s, w=1+trnd()*4;
      ctx.strokeStyle=trnd()<.6?'#2b1d14':'#7a5b43'; ctx.globalAlpha=0.35+trnd()*0.4; ctx.lineWidth=w;
      ctx.beginPath(); ctx.moveTo(x,0);
      for(let y=0;y<=s;y+=16) ctx.lineTo(x+Math.sin(y*0.08+i)*3,y);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  },[2,3]),
  pine: canvasTex(256,(ctx,s)=>{
    ctx.fillStyle='#2b6030'; ctx.fillRect(0,0,s,s);
    speckle(ctx,s,1400,['#1f4a25','#3b7a3d','#173b1c','#4a8a45'],1,4,0.55);
    ctx.lineWidth=1.5;
    for(let i=0;i<900;i++){ // Nadelstriche
      const x=trnd()*s,y=trnd()*s,a=trnd()*6.28;
      ctx.strokeStyle=['#16381b','#4c8c47'][(trnd()*2)|0]; ctx.globalAlpha=0.6;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*7,y+Math.sin(a)*7); ctx.stroke();
    }
    ctx.globalAlpha=1;
  },[4,2]),
  blossom: canvasTex(256,(ctx,s)=>{
    ctx.fillStyle='#f0a2bb'; ctx.fillRect(0,0,s,s);
    speckle(ctx,s,1600,['#f7c3d4','#e58aa9','#fde4ec','#d9739a'],1.5,5,0.7);
  },[3,2]),
  paper: canvasTex(128,(ctx,s)=>{
    ctx.fillStyle='#fff0c4'; ctx.fillRect(0,0,s,s);
    ctx.strokeStyle='#5a3a1a'; ctx.lineWidth=5;
    ctx.strokeRect(0,0,s,s);
    ctx.lineWidth=2.5;
    for(let i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(i*s/3,0); ctx.lineTo(i*s/3,s); ctx.stroke();
                          ctx.beginPath(); ctx.moveTo(0,i*s/3); ctx.lineTo(s,i*s/3); ctx.stroke(); }
  }),
};
T.bark.repeat.set(2,3);
const std=(o)=>new THREE.MeshStandardMaterial(o);
const M = {
  wood:  std({map:T.wood, roughness:.6}),                       // roter Lack
  dark:  std({map:T.dark, roughness:.8}),
  tile:  std({map:T.tile, bumpMap:T.tile, bumpScale:1.2, roughness:.5, metalness:.15, side:THREE.DoubleSide}),
  stone: std({map:T.stone, bumpMap:T.stone, bumpScale:1.5, roughness:.95}),
  plaster:std({map:T.plaster, roughness:.9}),
  gold:  new THREE.MeshStandardMaterial({color:0xd4a72c, roughness:.3, metalness:.8}),
  gravel:std({map:T.gravel, roughness:1}),
  grass: std({map:T.grass, roughness:1}),
  trunk: std({map:T.bark, bumpMap:T.bark, bumpScale:2, roughness:1}),
  leaf:  std({map:T.pine, roughness:1}),
  sakura:std({map:T.blossom, roughness:1}),
  water: new THREE.MeshStandardMaterial({color:0x3b7a9c, roughness:.1, metalness:.3}),
  glow:  std({map:T.paper, emissiveMap:T.paper, emissive:0xffa733, emissiveIntensity:0, roughness:.5}),
};
// Welt-Maßstab (Einheiten pro Textur-Kachel) für Quader; grain = Maserung längs der langen Kante
M.wood.userData={tile:2,grain:true}; M.dark.userData={tile:2,grain:true};
M.stone.userData={tile:2}; M.gravel.userData={tile:4}; M.plaster.userData={tile:3};
M.glow.userData={tile:0.5};
const glowMats = [M.glow];
// Zylinder (Pfeiler, Stützen): eigene Kopien mit passender Wiederholung
const cloneTex=(t,rx,ry)=>{ const c=t.clone(); c.needsUpdate=true; c.repeat.set(rx,ry); return c; };
M.woodC=std({map:cloneTex(T.wood,2,2), roughness:.6});
M.darkC=std({map:cloneTex(T.dark,2,2), roughness:.8});

function mesh(geo, mat, x=0,y=0,z=0, shadow=true){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
// Quader: UVs auf Weltmaßstab skalieren, damit Texturen auf jeder Größe gleich dicht bleiben
function box(w,h,d,mat,x,y,z){
  const g=new THREE.BoxGeometry(w,h,d), t=mat.userData.tile;
  if(t){
    const uv=g.attributes.uv, dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    dims.forEach(([a,b],f)=>{
      const sw=mat.userData.grain && a>b;
      for(let i=0;i<4;i++){
        const k=f*4+i; let u=uv.getX(k), v=uv.getY(k);
        if(sw){ [u,v]=[v,u]; uv.setXY(k,u*b/t,v*a/t); } else uv.setXY(k,u*a/t,v*b/t);
      }
    });
  }
  return mesh(g,mat,x,y,z);
}
const cyl = (rt,rb,h,mat,x,y,z,seg=16)=>mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat===M.wood?M.woodC:mat===M.dark?M.darkC:mat,x,y,z);

// ---------- Boden ----------
scene.add(mesh(new THREE.CircleGeometry(120,64).rotateX(-Math.PI/2), M.grass, 0,0,0,false));
const yard = box(46,0.2,46,M.gravel,0,0.1,0); yard.castShadow=false; scene.add(yard);

// Pfad zum Tempel
const path = box(4,0.25,30,M.stone,0,0.125,30); path.castShadow=false; scene.add(path);
for(let i=0;i<14;i++){
  const s = box(3.4,0.05,1.7,M.gravel,0,0.27,16+i*2.1); s.castShadow=false; scene.add(s);
}

// ---------- Dach (geschwungenes Walmdach mit hochgezogenen Ecken) ----------
function roofGeometry(w, d, h, lift=0.9, n=36){
  const pos=[], idx=[], uvs=[];
  for(let j=0;j<=n;j++) for(let i=0;i<=n;i++){
    const u=(i/n)*2-1, v=(j/n)*2-1;                // -1..1
    const m=Math.max(Math.abs(u),Math.abs(v));
    // Konkaves Profil: steil am First, flach zur Traufe
    let y = h*Math.pow(1-m,1.7);
    // Ecken schwingen nach oben
    y += lift*Math.pow(Math.abs(u*v),1.5);
    // Traufe leicht anheben
    y += 0.15*Math.pow(m,6);
    pos.push(u*w/2, y, v*d/2);
    uvs.push(i/n*w/2.2, j/n*d/2.2);   // Ziegel in Weltmaßstab
  }
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const a=j*(n+1)+i, b=a+1, c=a+n+1, e=c+1;
    idx.push(a,c,b, b,c,e);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function roof(w,d,h,lift){
  const grp=new THREE.Group();
  const top = mesh(roofGeometry(w,d,h,lift), M.tile);
  grp.add(top);
  // Dachkante (Holzbalken-Rahmen) darunter
  const rim = box(w*0.98,0.25,d*0.98,M.dark,0,0.05,0);
  grp.add(rim);
  // Firstziegel
  const ridge = box(w*0.12,0.35,d*0.12,M.dark,0,h+0.1,0);
  grp.add(ridge);
  return grp;
}

// ---------- Hauptgebäude (Haupthalle) ----------
const hall = new THREE.Group();
// Steinsockel (zwei Stufen)
hall.add(box(22,0.8,16,M.stone,0,0.5,0));
hall.add(box(20,0.8,14,M.stone,0,1.3,0));
// Treppe vorne
for(let i=0;i<5;i++) hall.add(box(6,0.32,1.2-0.0,M.stone,0,0.16+i*0.32,8.6-i*0.55+ -0.0));

const baseY = 1.7;
// Wände (Schiebetüren / Shoji)
hall.add(box(14,3.6,9,M.plaster,0,baseY+1.8,0));
// Holzpfeiler rundum
const px=[-7,-3.5,0,3.5,7], pz=[-4.5,4.5];
for(const x of px) for(const z of pz) hall.add(cyl(0.28,0.3,4.2,M.wood,x,baseY+2.1,z));
for(const z of [-1.5,1.5]) for(const x of [-7,7]) hall.add(cyl(0.28,0.3,4.2,M.wood,x,baseY+2.1,z));
// Balken oben
hall.add(box(14.8,0.4,0.5,M.wood,0,baseY+4.0,4.5));
hall.add(box(14.8,0.4,0.5,M.wood,0,baseY+4.0,-4.5));
hall.add(box(0.5,0.4,9.4,M.wood,7,baseY+4.0,0));
hall.add(box(0.5,0.4,9.4,M.wood,-7,baseY+4.0,0));
// Shoji-Türen (Front)
for(let i=-2;i<=2;i++){
  hall.add(box(2.6,3.0,0.12,M.plaster,i*3.0*0.9,baseY+1.6,4.7));
  hall.add(box(2.7,0.08,0.14,M.dark,i*3.0*0.9,baseY+1.6,4.72));
  hall.add(box(0.08,3.0,0.14,M.dark,i*3.0*0.9,baseY+1.6,4.72));
}
// Veranda (Engawa)
hall.add(box(16,0.25,11,M.dark,0,baseY+0.1,0));
// Geländer vorne
for(let x=-7.5;x<=7.5;x+=0.75) hall.add(cyl(0.05,0.05,0.9,M.wood,x,baseY+0.7,5.4));
hall.add(box(15.2,0.1,0.12,M.wood,0,baseY+1.2,5.4));

// Unteres Dach
const r1 = roof(21,15,3.4,1.1); r1.position.y = baseY+4.2; hall.add(r1);
// Oberer Aufbau
hall.add(box(10,2.2,6.5,M.plaster,0,baseY+5.6,0));
for(const x of [-5,5]) for(const z of [-3.25,3.25]) hall.add(cyl(0.22,0.22,2.4,M.wood,x,baseY+5.6,z));
const r2 = roof(15,11,3.0,1.0); r2.position.y = baseY+6.6; hall.add(r2);
// Goldene Ziegel-Ornamente
const orn = mesh(new THREE.ConeGeometry(0.28,0.9,10),M.gold,0,baseY+6.6+3.0+0.65,0); hall.add(orn);
for(const sx of [-1,1]){
  const sh = mesh(new THREE.SphereGeometry(0.35,12,12),M.gold,sx*1.0,baseY+6.6+3.05,0); sh.scale.set(1,1.2,1); hall.add(sh);
}
// Laternen unter dem Dachvorsprung
for(const x of [-6,-2,2,6]){
  const l=mesh(new THREE.SphereGeometry(0.35,16,16),M.glow,x,baseY+3.3,5.9); l.scale.y=1.3; hall.add(l);
  hall.add(cyl(0.01,0.01,0.8,M.dark,x,baseY+3.9,5.9,4));
}
hall.position.set(0,0,-8);
scene.add(hall);

// ---------- Pagode (5 Stockwerke) ----------
function pagoda(){
  const g=new THREE.Group();

function updateDeer(dt){
  for(const d of deers){

  carl.mode='free'; carl.path=path; carl.resume=resume;
  const g=path[path.length-1];
  goalMark.visible=resume===null; goalMark.position.set(g.x,groundY(g.x,g.z)+0.06,g.z);

}
// zurück auf die Runde: zum nächstgelegenen Punkt der Kurve laufen und dort wieder einfädeln
const loopSamples=Array.from({length:400},(_,i)=>{ const t=i/400, p=carl.curve.getPointAt(t); return {t,x:p.x,z:p.z}; });
function resumeLoop(){
  if(carl.mode==='loop') return;

  const y0=groundY(carl.pos.x,carl.pos.z);                    // Punkte auf gleicher Höhe bevorzugen (nicht den Sockel von unten ansteuern)
  for(const q of loopSamples){
    const dd=(q.x-carl.pos.x)**2+(q.z-carl.pos.z)**2+(Math.abs(groundY(q.x,q.z)-y0)>0.4?1e4:0);

const turnTo=(dir,want,maxStep)=>{              // Blickrichtung weich auf die Laufrichtung drehen
  const cur=Math.atan2(dir.x,dir.z); let df=Math.atan2(want.x,want.z)-cur;
  df=Math.atan2(Math.sin(df),Math.cos(df));
  const a=cur+Math.max(-maxStep,Math.min(maxStep,df)); dir.set(Math.sin(a),0,Math.cos(a));

// einem Wegpunkt-Array folgen; verbrauchte Punkte werden entfernt. Liefert true, wenn sich etwas bewegt hat.
function walkPath(pos,path,want,step){
  let moved=false;
  while(step>1e-6 && path.length){
    const w=path[0], dx=w.x-pos.x, dz=w.z-pos.z, L=Math.hypot(dx,dz);
    if(L>1e-6) want.set(dx/L,0,dz/L);
    if(L<=step){ pos.x=w.x; pos.z=w.z; step-=L; path.shift(); }
    else{ pos.x+=dx/L*step; pos.z+=dz/L*step; step=0; }
    moved=true;
  }
  return moved;
}

// Staubwölkchen: Sprite-Pool, bei jedem Fußaufsatz auf Kies ein kleiner Schwung
const dustTex=(()=>{

  const g=x.createRadialGradient(32,32,2,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.5,'rgba(255,255,255,.45)'); g.addColorStop(1,'rgba(255,255,255,0)');

const dust=[]; let dustI=0;

  sp.visible=false; sp.userData={life:0,max:1,vel:new THREE.Vector3(),size:1}; scene.add(sp); dust.push(sp);
}
const onGravel=(x,z)=>groundY(x,z)===0.2;
function puff(x,z,dir,n=5){

    sp.position.set(x+(Math.random()-.5)*0.3,0.3,z+(Math.random()-.5)*0.3);

function updateDust(dt){
  const dim=1-0.7*blend, dry=1-0.85*rainB;        // nachts dunkler, bei Regen kaum Staub

    const u=sp.userData; u.life+=dt;
    if(u.life>=u.max){ sp.visible=false; continue; }
    const k=u.life/u.max;
    sp.position.addScaledVector(u.vel,dt); u.vel.multiplyScalar(1-1.8*dt); u.vel.y+=0.15*dt;

// Schrittgeräusche (Web Audio): kurzer Rauschimpuls je Fußaufsatz, Klang je nach Untergrund.
// Der AudioContext darf erst nach einer Nutzeraktion starten -> beim ersten Klick/Tippen/Tastendruck.
let sfx=null;
function initSfx(){
  if(sfx) return;
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=Math.random()*2-1;
  const out=ac.createGain(); out.gain.value=0.9; out.connect(ac.destination);
  sfx={ac,buf,out};
}
for(const ev of ['pointerdown','keydown']) addEventListener(ev,initSfx,{once:true});
const surfaceAt=(x,z)=>{
  const y=groundY(x,z);
  if(y===0) return 'grass';
  if(y===0.2) return 'gravel';
  return Math.abs(z-12)<1.5 && x>9.35 && x<22.65 ? 'wood' : 'stone';
};
function stepSound(surface,vol){
  if(!sfx || vol<0.01) return;
  const {ac,buf,out}=sfx, t=ac.currentTime+0.01;
  const burst=(type,freq,q,dur,g,at=0)=>{                 // gefiltertes Rauschen mit schnellem Abklingen
    const src=ac.createBufferSource(), f=ac.createBiquadFilter(), a=ac.createGain();
    src.buffer=buf; f.type=type; f.frequency.value=freq*(0.85+Math.random()*0.3); f.Q.value=q;
    a.gain.setValueAtTime(0,t+at); a.gain.linearRampToValueAtTime(g*vol,t+at+0.004);
    a.gain.exponentialRampToValueAtTime(0.0008,t+at+dur);
    src.connect(f); f.connect(a); a.connect(out);
    src.start(t+at,Math.random()*0.8,dur+0.05);
  };
  const thump=(f0,f1,dur,g)=>{                            // dumpfer Körperschall
    const o=ac.createOscillator(), a=ac.createGain();
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    a.gain.setValueAtTime(g*vol,t); a.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(a); a.connect(out); o.start(t); o.stop(t+dur+0.02);
  };
  if(surface==='gravel'){ burst('bandpass',2600,0.7,0.11,0.55); burst('highpass',4200,0.5,0.07,0.3,0.035); thump(120,70,0.06,0.25); }
  else if(surface==='wood'){ thump(150,85,0.14,0.9); burst('bandpass',420,2.5,0.09,0.5); }
  else if(surface==='stone'){ burst('bandpass',1500,1.2,0.045,0.45); thump(170,95,0.05,0.4); }
  else { burst('lowpass',700,0.5,0.1,0.28); }             // Wiese: weich
}
function updateCarl(dt){
  const d=carl, S=d.mesh.scale.x, {body,head,arms,elbows,legs,knees}=d.mesh.userData;
  const p=d.pos, tg=d.dir, v=d.speed;
  let moving=false;
  if(d.mode==='loop'){
    d.t=(d.t+v*dt/d.len)%1;
    const q=d.curve.getPointAt(d.t); p.x=q.x; p.z=q.z; tg.copy(d.curve.getTangentAt(d.t)).setY(0).normalize();
    moving=v>0;
  } else {
    moving=walkPath(p,d.path,d.want,v*dt);
    turnTo(tg,d.want,dt*9);
    if(!d.path.length){
      goalMark.visible=false;
      if(d.resume!==null){ d.mode='loop'; d.t=d.resume; d.resume=null; }     // wieder auf der Runde
    }
  }
  if(goalMark.visible) goalMark.scale.setScalar(1+0.12*Math.sin(clock.elapsedTime*6));
  d.move+=((moving?1:0)-d.move)*Math.min(1,dt*8);                         // 0 = steht, 1 = läuft (weicher Übergang)
  const mv=d.move;
  d.mesh.rotation.y=Math.atan2(tg.x,tg.z);
  const tr=d.trail, last=tr[tr.length-1];                                 // Spur für den Hirsch
  if(!last || (p.x-last.x)**2+(p.z-last.z)**2>0.09){ tr.push({x:p.x,z:p.z}); if(tr.length>3000) tr.shift(); }
  const prev=d.phase, run=Math.min(1,Math.max(0,(v-1)/2.2));              // 0 = Gehen, 1 = Joggen (Regler)
  const A0=0.34+0.28*run, A=A0*mv;                                        // Schwungweite der Beine
  if(moving) d.phase+=v*dt*Math.PI/(2*0.78*Math.sin(A0)*S*(1+0.265*run)); // Schrittfrequenz passend zur Schrittlänge (keine rutschenden Füße)
  const s=Math.sin(d.phase), c=Math.cos(d.phase);
  // Bein 0 schwingt mit s nach vorn, Bein 1 gegengleich; das vorschwingende Bein winkelt an (beim Joggen stark)
  const kb=0.7+0.55*run, kick=0.35*run;
  const a=[A*s,-A*s], kn=[mv*(0.12+0.08*run+kb*Math.max(0,c)+kick*Math.max(0,-s)), mv*(0.12+0.08*run+kb*Math.max(0,-c)+kick*Math.max(0,s))];
  let low=Infinity;
  for(let i=0;i<2;i++){
    legs[i].rotation.x=-a[i]; knees[i].rotation.x=kn[i];
    const f=a[i]-kn[i], sf=Math.sin(f);            // Unterschenkelwinkel; Sohle reicht von der Ferse (-0.07) bis zur Spitze (+0.16)
    low=Math.min(low,0.78-0.36*Math.cos(a[i])-0.42*Math.cos(f)+Math.min(0.16*sf,-0.07*sf));
  }
  const arm=A*(0.8+0.3*run), eb=0.12+(0.18+1.05*run)*mv;                   // Arme gegengleich, Ellbogen beim Joggen angewinkelt
  arms[0].rotation.x=arm*s; arms[1].rotation.x=-arm*s;
  elbows[0].rotation.x=-eb-0.25*s*mv; elbows[1].rotation.x=-eb+0.25*s*mv;
  body.position.y=0; body.rotation.x=(0.04+0.12*run)*mv; body.rotation.y=s*(0.08+0.06*run)*mv;
  head.rotation.x=-0.1*run*mv;
  head.rotation.y=-s*(0.08+0.06*run)*mv+Math.sin(clock.elapsedTime*0.7)*0.2;   // schaut sich um
  head.rotation.z=Math.sin(clock.elapsedTime*0.9)*0.04;
  // tiefster Fuß steht auf dem Boden, dazwischen eine kurze Flugphase
  p.y=groundY(p.x,p.z)+S*(-low+0.035*run*mv*Math.abs(c));
  d.mesh.position.copy(p);
  // Fußaufsatz (Bein ganz vorn): Staub auf Kies
  const step=Math.floor((d.phase-Math.PI/2)/Math.PI);
  if(moving && step!==Math.floor((prev-Math.PI/2)/Math.PI)){
    const side=(step%2===0?-1:1)*0.08*S, fx=p.x+tg.x*0.7+tg.z*side, fz=p.z+tg.z*0.7-tg.x*side;
    if(v>1.2 && onGravel(fx,fz)) puff(fx,fz,tg,Math.round(2+3*run));
    const dist=camera.position.distanceTo(p);                      // leiser mit Abstand zur Kamera
    stepSound(surfaceAt(fx,fz),(0.45+0.55*run)/(1+(dist/28)**2));
  }
  const gl=0.34*(1-0.72*blend)*(1-0.35*rainB);
  for(const m of carlGlow) m.emissiveIntensity=gl;
}

// Damhirsch, der Carl nachläuft: folgt Carls Spur (trail) mit Abstand – damit auf demselben hindernisfreien Weg,
// egal ob Carl seine Runde läuft oder zu einem Klickziel unterwegs ist
const chaser={mesh:makeDeer(false), gap:4.6, phase:0, side:0, move:0, pos:new THREE.Vector3(), dir:new THREE.Vector3(0,0,1), want:new THREE.Vector3(0,0,1)};
chaser.mesh.scale.setScalar(1.2); chaser.mesh.rotation.order='YXZ'; scene.add(chaser.mesh);
{ // Start: hinter Carl auf der Runde, Spur bis zu ihm vorbelegen
  const t0=carl.t-chaser.gap/carl.len;
  for(let i=0;i<=16;i++){ const q=carl.curve.getPointAt((((t0+(carl.t-t0)*i/16)%1)+1)%1); carl.trail.push({x:q.x,z:q.z}); }
  const f=carl.trail.shift(); chaser.pos.set(f.x,0,f.z); chaser.dir.copy(carl.dir);
}
function updateChaser(dt){
  const d=chaser, S=d.mesh.scale.x, tr=carl.trail, p=d.pos, tg=d.dir;
  let len=0, px=p.x, pz=p.z;                                  // Weglänge entlang der Spur bis zu Carl
  for(const q of tr){ len+=Math.hypot(q.x-px,q.z-pz); px=q.x; pz=q.z; }
  const v=len>d.gap ? carl.speed*(len>d.gap+1.5?1.3:1) : 0;   // aufschließen, sonst Abstand halten
  const moving=v>0 && walkPath(p,tr,d.want,Math.min(v*dt,len-d.gap));
  turnTo(tg,d.want,dt*7);
  d.move+=((moving?1:0)-d.move)*Math.min(1,dt*6);
  // auf freiem, ebenem Gelände seitlich versetzt (von vorn sichtbar), sonst genau in Carls Spur
  const sx=-tg.z, sz=tg.x;
  const open=groundY(p.x,p.z)<=0.3 && navFree(p.x+sx*1.4,p.z+sz*1.4) && navFree(p.x+sx*2,p.z+sz*2) && groundY(p.x+sx*2,p.z+sz*2)<=0.3;
  d.side+=((open?1.4:0)-d.side)*Math.min(1,dt*2.5);
  const x=p.x+sx*d.side, z=p.z+sz*d.side;
  // Höhe und Neigung aus dem Boden unter Vorder- und Hinterläufen (Treppe, Brücke)
  const r=0.7*S, yf=groundY(x+tg.x*r,z+tg.z*r), yb=groundY(x-tg.x*r,z-tg.z*r);
  if(moving) d.phase+=v*dt*3.2/S;
  const trot=Math.min(1,v/3)*d.move, sw=Math.sin(d.phase)*(0.3+0.3*trot)*d.move, {legs,neck,head}=d.mesh.userData;
  legs[0].rotation.x= sw;  legs[3].rotation.x= sw;   // Diagonalgang
  legs[1].rotation.x=-sw;  legs[2].rotation.x=-sw;
  d.mesh.position.set(x,(yf+yb)/2+Math.abs(Math.cos(d.phase))*0.05*trot,z);
  d.mesh.rotation.y=Math.atan2(tg.x,tg.z);
  d.mesh.rotation.x+=(-Math.atan2(yf-yb,2*r)-d.mesh.rotation.x)*Math.min(1,dt*10);
  neck.rotation.x=Math.sin(clock.elapsedTime*1.3)*0.06+0.25*trot;       // Kopf beim Laufen etwas vorgestreckt
  head.rotation.x=0.35+Math.sin(clock.elapsedTime*1.1+1)*0.05;
}

// ---------- Himmelskuppel: Verlauf, Sonne/Mond, prozedurale Wolken (fBm-Rauschen), Sterne ----------
const zenDay=new THREE.Color(0x2f74c9), zenNight=new THREE.Color(0x060a1c);
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false,

  fragmentShader:`
    precision highp float;

    float noise(vec2 p){

    }

// ---------- Musik (Web Audio, generativ: Koto-Zupfen + Shakuhachi-Linie in Hirajōshi) ----------
let music=null;
function startMusic(){
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const out=ac.createGain(); out.gain.value=0; out.connect(ac.destination);
  out.gain.linearRampToValueAtTime(0.5,ac.currentTime+1.5);

  const wet=ac.createGain(); wet.gain.value=0.3; wet.connect(out);
  for(const [t,fb] of [[0.23,0.42],[0.37,0.36]]){
    const d=ac.createDelay(1); d.delayTime.value=t; const g=ac.createGain(); g.gain.value=fb;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
    wet.connect(d); d.connect(lp); lp.connect(g); g.connect(d); lp.connect(out);
  }
  const SCALE=[0,2,3,7,8], BASE=146.83;          // Hirajōshi auf D
  const freq=i=>BASE*2**(Math.floor(i/5)+SCALE[((i%5)+5)%5]/12);
  function koto(i,t,vel=1){
    const f=freq(i), g=ac.createGain(), lp=ac.createBiquadFilter();
    lp.type='lowpass'; lp.Q.value=2;
    lp.frequency.setValueAtTime(f*9,t); lp.frequency.exponentialRampToValueAtTime(f*1.5,t+0.7);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.32*vel,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.001,t+2.6);
    for(const [type,det,lvl] of [['sawtooth',0,1],['triangle',5,0.7]]){
      const o=ac.createOscillator(), og=ac.createGain(); o.type=type; o.detune.value=det; og.gain.value=lvl;
      o.frequency.setValueAtTime(f*1.012,t); o.frequency.exponentialRampToValueAtTime(f,t+0.06);   // Anzupf-Biegung
      o.connect(og); og.connect(lp); o.start(t); o.stop(t+2.7);
    }
    lp.connect(g); g.connect(out); g.connect(wet);
  }
  function flute(i,t,dur){
    const f=freq(i), o=ac.createOscillator(), g=ac.createGain(), vib=ac.createOscillator(), vg=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f*0.97,t); o.frequency.linearRampToValueAtTime(f,t+0.25);
    vib.frequency.value=4.6; vg.gain.setValueAtTime(0,t); vg.gain.linearRampToValueAtTime(f*0.012,t+dur*0.6);
    vib.connect(vg); vg.connect(o.frequency);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.11,t+0.35);
    g.gain.setValueAtTime(0.11,t+dur*0.7); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g); g.connect(out); g.connect(wet);
    o.start(t); vib.start(t); o.stop(t+dur+0.05); vib.stop(t+dur+0.05);
  }
  // Ablauf: Phrasen aus kleinen Schritten, dazwischen Atempausen (ma)
  let next=ac.currentTime+0.3, pos=7, fl=ac.currentTime+4, beat=0;
  const r=Math.random, BEAT=0.52;
  const timer=setInterval(()=>{
    while(next<ac.currentTime+0.6){
      const p=r();
      if(p<0.16){ next+=BEAT*(1+Math.floor(r()*3)); beat++; continue; }
      pos=Math.max(3,Math.min(14,pos+[-2,-1,-1,1,1,2,3,-3][Math.floor(r()*8)]));
      koto(pos,next,0.7+r()*0.3);
      if(p>0.8) koto(pos-5,next+0.012,0.5);                         // Oktavbass
      if(p>0.93){ for(let k=1;k<=4;k++) koto(pos+k,next+k*0.07,0.45); pos+=4; }   // Glissando
      if(beat%8===0) koto(pos%5-5,next,0.6);
      next+=BEAT*(r()<0.3?0.5:1); beat++;
    }
    if(fl<ac.currentTime+0.6){
      const d=2.5+r()*2.5; flute(10+Math.floor(r()*6),fl,d); fl+=d+2+r()*7;
    }
  },150);
  return {stop(){ clearInterval(timer); out.gain.cancelScheduledValues(ac.currentTime); out.gain.setTargetAtTime(0,ac.currentTime,0.25); setTimeout(()=>ac.close(),1500); }};
}
document.getElementById('speedIn').oninput=e=>{ carl.speed=+e.target.value; };
btn('musicBtn',()=>{ if(music){ music.stop(); music=null; } else music=startMusic(); return !!music; });

// Carl folgen: Kamera bleibt immer vor Carl und schaut ihm ins Gesicht; Zoom und Höhe bleiben frei, beim Ausschalten zurück zur vorherigen Ansicht
let follow=false, savedView=null;
const carlHead=new THREE.Vector3(), camStep=new THREE.Vector3(), followDir=new THREE.Vector3();
btn('carlBtn',()=>{
  follow=!follow;
  if(follow){
    savedView={p:camera.position.clone(), t:controls.target.clone()};
    carl.mesh.getWorldDirection(followDir);
    carlHead.copy(carl.mesh.position); carlHead.y=groundY(carlHead.x,carlHead.z)+2.6;
    controls.target.copy(carlHead);
    camera.position.copy(carlHead).addScaledVector(followDir,7.5); camera.position.y+=1.2;
    resumeLoop();                                              // im Folgemodus läuft Carl wieder seine Runde
  } else if(savedView){ camera.position.copy(savedView.p); controls.target.copy(savedView.t); }
  return follow;
});
function updateFollow(){
  if(!follow) return;
  carlHead.copy(carl.mesh.position); carlHead.y=groundY(carlHead.x,carlHead.z)+2.6;
  carl.mesh.getWorldDirection(camStep);
  followDir.lerp(camStep,0.06).setY(0).normalize();            // in Kurven weich mitschwenken
  camStep.subVectors(camera.position,controls.target);         // Abstand (Zoom) und Höhe des Nutzers beibehalten
  const h=Math.hypot(camStep.x,camStep.z);
  controls.target.copy(carlHead);
  camera.position.set(carlHead.x+followDir.x*h, carlHead.y+camStep.y, carlHead.z+followDir.z*h);
}

// Klick (kein Ziehen) auf den Boden: Carl läuft dorthin – nur außerhalb des Folgemodus
const picker=new THREE.Raycaster(), pickNdc=new THREE.Vector2(), pickPt=new THREE.Vector3();
function pickGround(cx,cy){                     // Strahl gegen das Höhenfeld groundY marschieren lassen
  pickNdc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1); picker.setFromCamera(pickNdc,camera);
  const ray=picker.ray; let t0=0;
  for(let t=0.5;t<400;t+=0.5){
    ray.at(t,pickPt);
    if(pickPt.y<=groundY(pickPt.x,pickPt.z)){
      let a=t0, b=t;
      for(let i=0;i<10;i++){ const m=(a+b)/2; ray.at(m,pickPt); if(pickPt.y<=groundY(pickPt.x,pickPt.z)) b=m; else a=m; }
      ray.at(b,pickPt); return pickPt;
    }
    t0=t;
  }
  return null;
}
let pickDown=null;
renderer.domElement.addEventListener('pointerdown',e=>{ pickDown=e.button===0?{x:e.clientX,y:e.clientY}:null; });
renderer.domElement.addEventListener('pointerup',e=>{
  const d=pickDown; pickDown=null;
  if(!d || follow || Math.hypot(e.clientX-d.x,e.clientY-d.y)>6) return;      // Ziehen = Kamera drehen, kein Klick
  const hit=pickGround(e.clientX,e.clientY);
  if(hit) sendCarl(hit.x,hit.z);
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

renderer.setAnimationLoop(()=>{
  blend += ((night?1:0)-blend)*0.05;
  rainB += ((raining?1:0)-rainB)*0.03;
  const dt=Math.min(clock.getDelta(),0.05);
  updateDeer(dt); updateGiraffe(dt); updateCarl(dt); updateChaser(dt); updateDust(dt); updateFollow();
  applyLight(blend);
  rain.visible=rainB>0.01;
  if(rain.visible){
    rainMat.opacity=0.55*rainB;
    const p=rainPos;
    for(let i=0;i<RAIN_N;i++){
      const o=i*6, dy=rainVel[i]*1.1;
      p[o+1]-=dy; p[o+4]-=dy;
      p[o]-=0.04; p[o+3]-=0.04;
      if(p[o+1]<0){ const y=RAIN_H; p[o+1]=y; p[o+4]=y+0.9; }
    }
    rainGeo.attributes.position.needsUpdate=true;
  }
  controls.update();
  sky.position.copy(camera.position); skyMat.uniforms.uTime.value=clock.elapsedTime;
  renderer.render(scene,camera);
});
</script>
